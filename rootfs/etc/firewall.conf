# Konfigurasi Firewall Kernel nftables (dibaca oleh /etc/init.d/S15firewall)
# Setelah mengubah file ini atau custom port di tinyssh.conf / agent.conf,
# jalankan: /etc/init.d/S15firewall restart

ENABLE_FIREWALL="1"

# Opsional: daftar IP yang diizinkan mengakses port manajemen (pisahkan spasi).
# Jika diisi (misal "1.2.3.4 2001:db8::1"), IP lain ke port manajemen akan di-drop.
# Jika kosong, mode public + auto-ban rate-limit aktif.
TRUSTED_IPS=""

# Port manajemen tambahan (selain TINYSSH_PORT & port LISTEN x-ui-agent-rs yang terdeteksi otomatis)
ADMIN_PORTS=""

# Batas koneksi baru per menit per IP ke port manajemen sebelum auto-ban
RATELIMIT_PER_MIN="5"

# Durasi auto-ban otomatis di kernel (menit)
BAN_MINUTES="10"
