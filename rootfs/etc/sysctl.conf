# TCP BBR & Fair Queueing (Wajib untuk XTLS Vision & throughput tinggi)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Batas Memori TCP/UDP proporsional untuk 128 MB RAM
# tcp_mem dalam halaman 4KB (4MB / 8MB / 16MB agar traffic spike tidak memicu OOM)
net.ipv4.tcp_mem = 1024 2048 4096
net.ipv4.tcp_rmem = 4096 65536 1048576
net.ipv4.tcp_wmem = 4096 65536 1048576
# Buffer socket maks 2 MB (optimal untuk WireGuard UDP & VLESS REALITY/QUIC)
net.core.rmem_max = 2097152
net.core.wmem_max = 2097152
net.core.netdev_max_backlog = 2048
net.core.somaxconn = 1024

# Optimasi koneksi TCP REALITY & Forwarding WireGuard
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_syncookies = 1
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1
net.ipv4.conf.all.rp_filter = 0
net.ipv4.conf.default.rp_filter = 0

# File descriptors & Manajemen Memori 128 MB RAM
fs.file-max = 65535
vm.vfs_cache_pressure = 150
vm.swappiness = 10
vm.min_free_kbytes = 2048
kernel.printk = 3 4 1 3
