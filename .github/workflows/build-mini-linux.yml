name: Build Mini-Linux 128MB

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v0.1.*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (0.1.x, default from VERSION file)"
        required: false
        default: ""
      create_release:
        description: "Create GitHub Release for this ISO"
        type: boolean
        required: false
        default: false
      root_password:
        description: "Initial root password (default: minilinux)"
        required: false
        default: "minilinux"
      force_rebuild:
        description: "Bypass compiled binary caches and rebuild from source"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ROOT_PASSWORD: ${{ inputs.root_password || 'minilinux' }}
      FORCE_REBUILD: ${{ inputs.force_rebuild == true && '1' || '0' }}
      CCACHE_DIR: ${{ github.workspace }}/build/cache/ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version (0.1.x)
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(tr -d '[:space:]' < VERSION)"
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${VER}" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ccache \
            bc \
            bison \
            flex \
            libelf-dev \
            libssl-dev \
            musl-dev \
            musl-tools \
            linux-libc-dev \
            syslinux \
            extlinux \
            isolinux \
            syslinux-common \
            xorriso \
            e2fsprogs \
            fdisk \
            binutils \
            ca-certificates \
            curl \
            xz-utils \
            bzip2

      - name: Install Rust toolchain (musl)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Restore upstream source tarballs cache
        id: cache-dl
        uses: actions/cache/restore@v4
        with:
          path: build/dl
          key: mini-linux-sources-v3-${{ hashFiles('scripts/common.sh') }}

      - name: Restore compiled kernel cache
        id: cache-kernel
        uses: actions/cache/restore@v4
        with:
          path: build/cache/kernel
          key: mini-linux-kernel-v1-${{ hashFiles('configs/kernel-mini-x86_64.config', 'scripts/01-build-kernel.sh', 'scripts/common.sh') }}

      - name: Restore kernel ccache
        id: cache-ccache
        uses: actions/cache/restore@v4
        with:
          path: build/cache/ccache
          key: mini-linux-ccache-v1-${{ hashFiles('configs/kernel-mini-x86_64.config', 'scripts/common.sh') }}
          restore-keys: |
            mini-linux-ccache-v1-

      - name: Restore BusyBox cache
        id: cache-busybox
        uses: actions/cache/restore@v4
        with:
          path: build/cache/busybox
          key: mini-linux-busybox-v3-${{ hashFiles('configs/busybox-mini.fragment', 'scripts/02-build-busybox.sh', 'scripts/common.sh') }}

      - name: Restore x-ui-agent-rs cache
        id: cache-agent
        uses: actions/cache/restore@v4
        with:
          path: build/cache/x-ui-agent
          key: mini-linux-agent-v1-${{ hashFiles('scripts/03-build-x-ui-agent.sh', 'scripts/common.sh') }}

      - name: Restore WireGuard CLI cache
        id: cache-wireguard
        uses: actions/cache/restore@v4
        with:
          path: build/cache/wireguard
          key: mini-linux-wireguard-v1-${{ hashFiles('scripts/03b-build-wireguard.sh', 'scripts/common.sh') }}

      - name: Restore e2fsprogs cache
        id: cache-e2fsprogs
        uses: actions/cache/restore@v4
        with:
          path: build/cache/e2fsprogs
          key: mini-linux-e2fsprogs-v1-${{ hashFiles('scripts/03c-build-e2fsprogs.sh', 'scripts/common.sh') }}

      - name: Restore htop cache
        id: cache-htop
        uses: actions/cache/restore@v4
        with:
          path: build/cache/htop
          key: mini-linux-htop-v1-${{ hashFiles('scripts/03d-build-htop.sh', 'scripts/common.sh') }}

      - name: Restore TinySSH cache
        id: cache-tinyssh
        uses: actions/cache/restore@v4
        with:
          path: build/cache/tinyssh
          key: mini-linux-tinyssh-v1-${{ hashFiles('scripts/03e-build-tinyssh.sh', 'scripts/common.sh') }}

      - name: Prepare clean rootfs and script permissions
        run: |
          chmod +x scripts/*.sh
          rm -rf build/rootfs
          mkdir -p build/rootfs

      - name: Build Linux Kernel (tinyconfig)
        run: bash scripts/01-build-kernel.sh

      - name: Save kernel cache
        if: steps.cache-kernel.outputs.cache-hit != 'true' && hashFiles('build/cache/kernel/bzImage') != ''
        uses: actions/cache/save@v4
        with:
          path: build/cache/kernel
          key: ${{ steps.cache-kernel.outputs.cache-primary-key }}

      - name: Save kernel ccache
        if: steps.cache-ccache.outputs.cache-hit != 'true' && steps.cache-kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/cache/ccache
          key: ${{ steps.cache-ccache.outputs.cache-primary-key }}

      - name: Build BusyBox (static musl)
        run: bash scripts/02-build-busybox.sh

      - name: Save BusyBox cache
        if: steps.cache-busybox.outputs.cache-hit != 'true' && hashFiles('build/cache/busybox/busybox-rootfs.tar.gz') != ''
        uses: actions/cache/save@v4
        with:
          path: build/cache/busybox
          key: ${{ steps.cache-busybox.outputs.cache-primary-key }}

      - name: Build x-ui-agent-rs (static musl, embedded shoes)
        run: bash scripts/03-build-x-ui-agent.sh

      - name: Save x-ui-agent-rs cache
        if: steps.cache-agent.outputs.cache-hit != 'true' && hashFiles('build/cache/x-ui-agent/x-ui-agent-rs') != ''
        uses: actions/cache/save@v4
        with:
          path: build/cache/x-ui-agent
          key: ${{ steps.cache-agent.outputs.cache-primary-key }}

      - name: Build WireGuard CLI (static musl)
        run: bash scripts/03b-build-wireguard.sh

      - name: Save WireGuard cache
        if: steps.cache-wireguard.outputs.cache-hit != 'true' && hashFiles('build/cache/wireguard/wg') != ''
        uses: actions/cache/save@v4
        with:
          path: build/cache/wireguard
          key: ${{ steps.cache-wireguard.outputs.cache-primary-key }}

      - name: Build e2fsprogs resize2fs & e2fsck (static musl)
        run: bash scripts/03c-build-e2fsprogs.sh

      - name: Save e2fsprogs cache
        if: steps.cache-e2fsprogs.outputs.cache-hit != 'true' && hashFiles('build/cache/e2fsprogs/resize2fs') != ''
        uses: actions/cache/save@v4
        with:
          path: build/cache/e2fsprogs
          key: ${{ steps.cache-e2fsprogs.outputs.cache-primary-key }}

      - name: Build htop (static musl + ncurses)
        run: bash scripts/03d-build-htop.sh

      - name: Save htop cache
        if: steps.cache-htop.outputs.cache-hit != 'true' && hashFiles('build/cache/htop/htop') != ''
        uses: actions/cache/save@v4
        with:
          path: build/cache/htop
          key: ${{ steps.cache-htop.outputs.cache-primary-key }}

      - name: Build TinySSH (static musl)
        run: bash scripts/03e-build-tinyssh.sh

      - name: Save TinySSH cache
        if: steps.cache-tinyssh.outputs.cache-hit != 'true' && hashFiles('build/cache/tinyssh/tinysshd') != ''
        uses: actions/cache/save@v4
        with:
          path: build/cache/tinyssh
          key: ${{ steps.cache-tinyssh.outputs.cache-primary-key }}

      - name: Save upstream source tarballs cache
        if: always() && steps.cache-dl.outputs.cache-hit != 'true' && hashFiles('build/dl/*') != ''
        uses: actions/cache/save@v4
        with:
          path: build/dl
          key: ${{ steps.cache-dl.outputs.cache-primary-key }}

      - name: Assemble RootFS & Pack ISO (.iso only)
        run: |
          bash scripts/04-assemble-rootfs.sh
          bash scripts/05-pack-images.sh
          ls -lh out/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: mini-linux-v${{ steps.ver.outputs.version }}-x86_64-iso
          path: out/mini-linux-*.iso
          retention-days: 30

      - name: Create GitHub Release (ISO only)
        if: startsWith(github.ref, 'refs/tags/v0.1.') || inputs.create_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          ISO_FILE="out/mini-linux-${TAG}.iso"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ISO_FILE" --clobber
          else
            gh release create "$TAG" "$ISO_FILE" \
              --title "Mini-Linux 128MB ${TAG}" \
              --notes "Zero-initramfs x86_64 Mini-Linux (${TAG}) with x-ui-agent-rs (embedded shoes), TinySSH (public-key only), WireGuard, htop, netui (dual-stack IPv4/IPv6), and ext4 disk installer."
          fi
